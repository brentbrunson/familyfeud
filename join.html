<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the game</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/common.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.t{border-radius:24px;padding:34px 16px;font-size:30px;font-weight:900;text-decoration:none;color:#0a1a5c;display:block;line-height:1.1}
.t small{display:block;font-size:15px;font-weight:700;opacity:.75;margin-top:6px}
.A{background:#ff6b81}.B{background:#3fe0c5}
h1{font-size:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Join the game</h1>
  <div class="mut" id="msg">Which team are you captain of?</div>
  <a class="t A" id="a" href="#">Team A<small>Tap if you're on this team</small></a>
  <a class="t B" id="b" href="#">Team B<small>Tap if you're on this team</small></a>
</div>
<script>
const code = location.pathname.split('/').pop().toUpperCase().slice(0, 4);
fetch('/api/room?r=' + code).then((r) => r.json()).then((j) => {
  if (!j.exists) { document.getElementById('msg').textContent = 'That game code was not found. Check the code with your host.'; document.getElementById('a').style.display = document.getElementById('b').style.display = 'none'; return; }
  document.getElementById('title').textContent = j.title;
  for (const t of ['A', 'B']) {
    const el = document.getElementById(t.toLowerCase());
    el.firstChild.textContent = j[t];
    el.href = '/b?r=' + code + '&t=' + t;
  }
}).catch(() => { document.getElementById('msg').textContent = 'Could not reach the game. Check your connection.'; });
</script>
</body>
</html>
