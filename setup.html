<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your game</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/common.css">
<style>
.ans{display:grid;grid-template-columns:30px 1fr 84px 40px;gap:8px;align-items:center;margin-bottom:6px}
.ans .n{color:var(--mut);font-weight:800;text-align:center}
.ans button{min-height:40px;padding:0}
.qhead{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.tot{font-size:13px;color:var(--mut);margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0a0f2aee;border-top:1px solid var(--line);padding:10px 14px;z-index:10}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
.logo{max-height:70px;max-width:200px;background:#0a1a66;border-radius:8px;padding:6px}
.sel{width:auto;min-width:150px}
textarea{min-height:200px;font-family:Menlo,Consolas,monospace;font-size:12px}
.hdr2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:26px 0 8px}
.hdr2 h2{margin:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:700}
.chk input{width:22px;height:22px;min-height:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Set up your game</h1>
  <p class="mut">Everything here can be changed. Answers show on the TV with the highest points first. <b>Your changes save to the game when you tap the green button at the bottom.</b></p>
  <div class="err" id="err"></div>

  <h2>The basics</h2>
  <div class="card">
    <label class="l">Game name (shown on the title screen)</label>
    <input data-p="title" maxlength="40" placeholder="Smith Family Feud">
    <div class="row" style="margin-top:12px">
      <div class="grow"><label class="l">Team A name</label><input data-p="teams.0" maxlength="24"></div>
      <div class="grow"><label class="l">Team B name</label><input data-p="teams.1" maxlength="24"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div id="logoWrap"></div>
      <label class="btn ghost small" for="logoFile" style="cursor:pointer">Add a logo or family photo (optional)</label>
      <input type="file" id="logoFile" accept="image/png,image/jpeg" style="display:none">
      <button class="ghost small" id="logoDel" style="display:none">Remove logo</button>
    </div>
  </div>

  <div class="hdr2"><h2>Rounds</h2><button class="small gold" data-act="addRound">+ Add round</button></div>
  <div id="rounds"></div>

  <div class="hdr2"><h2>Fast Money (bonus round)</h2></div>
  <div class="card">
    <label class="chk"><input type="checkbox" id="fmOn"> Include a Fast Money round</label>
    <div id="fmBody"></div>
  </div>

  <h2>Save, load, or start over</h2>
  <div class="card"><div class="row">
    <button class="ghost" id="exportBtn">Copy my game as text</button>
    <button class="ghost" id="importBtn">Paste a saved game</button>
    <button class="ghost" id="sampleBtn">Reset to the Thanksgiving sample</button>
  </div>
  <div id="io" style="display:none;margin-top:10px">
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button class="go small" id="ioApply">Use this</button><button class="ghost small" id="ioClose">Close</button><span class="mut" id="ioNote"></span></div>
  </div></div>
</div>

<div class="bar"><div class="in">
  <div class="grow mut" id="status">Not saved yet</div>
  <button class="go" id="save">Save &amp; go to the game controls</button>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
const R = q.get('r'), K = q.get('k');
if (!R || !K) location.href = '/';
let D = null, dirty = false;

const toState = (d) => ({
  title: d.title || '', logo: d.logo || '', teams: [d.teams[0], d.teams[1]],
  rounds: d.rounds.map((r) => ({ title: r.title, mult: r.mult, question: r.question, answers: r.answers.map((a) => ({ text: a[0] != null ? a[0] : a.text, pts: a[1] != null ? a[1] : a.pts })) })),
  fastMoney: { enabled: d.fastMoney.questions.length > 0, target: d.fastMoney.target, p1Seconds: d.fastMoney.p1Seconds, p2Seconds: d.fastMoney.p2Seconds,
    questions: d.fastMoney.questions.map((x) => ({ q: x.q, answers: x.answers.map((a) => ({ text: a[0] != null ? a[0] : a.text, pts: a[1] != null ? a[1] : a.pts })) })) }
});
const blankAns = (n) => Array.from({ length: n }, () => ({ text: '', pts: 0 }));

/* ---------- path helpers ---------- */
function getP(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setP(o, p, v) { const ks = p.split('.'); const last = ks.pop(); let t = o; for (const k of ks) t = t[k]; t[last] = v; }

/* ---------- rendering ---------- */
function ansRows(base, list) {
  return list.map((a, j) => '<div class="ans"><span class="n">' + (j + 1) + '</span>' +
    '<input data-p="' + base + '.' + j + '.text" maxlength="60" placeholder="Answer ' + (j + 1) + '" value="' + esc(a.text) + '">' +
    '<input data-p="' + base + '.' + j + '.pts" data-num="1" type="number" min="0" max="999" inputmode="numeric" placeholder="pts" value="' + esc(a.pts) + '">' +
    '<button class="ghost" title="Remove" data-act="delAns" data-base="' + base + '" data-j="' + j + '">&times;</button></div>').join('');
}
function renderRounds() {
  $('#rounds').innerHTML = D.rounds.map((r, i) =>
    '<div class="card"><div class="qhead">' +
      '<div class="grow"><label class="l">Round ' + (i + 1) + ' question</label><input data-p="rounds.' + i + '.question" maxlength="200" placeholder="Name something you would find on a Thanksgiving table." value="' + esc(r.question) + '"></div>' +
      '<div><label class="l">Points</label><select class="sel" data-p="rounds.' + i + '.mult" data-num="1">' +
        [1, 2, 3].map((m) => '<option value="' + m + '"' + (r.mult === m ? ' selected' : '') + '>' + (m === 1 ? 'Single (x1)' : m === 2 ? 'Double (x2)' : 'Triple (x3)') + '</option>').join('') + '</select></div>' +
    '</div>' +
    ansRows('rounds.' + i + '.answers', r.answers) +
    '<div class="row"><button class="small ghost" data-act="addAns" data-base="rounds.' + i + '.answers"' + (r.answers.length >= 8 ? ' disabled' : '') + '>+ Add answer</button>' +
    '<span class="tot" data-total="rounds.' + i + '.answers"></span><span class="grow"></span>' +
    '<button class="small bad" data-act="delRound" data-i="' + i + '"' + (D.rounds.length <= 1 ? ' disabled' : '') + '>Delete round</button></div></div>').join('');
  totals();
}
function renderFm() {
  const f = D.fastMoney, on = f.enabled;
  $('#fmOn').checked = on;
  if (!on) { $('#fmBody').innerHTML = ''; return; }
  $('#fmBody').innerHTML =
    '<div class="row" style="margin:12px 0">' +
      '<div class="grow"><label class="l">Player 1 seconds</label><input data-p="fastMoney.p1Seconds" data-num="1" type="number" min="5" max="60" value="' + esc(f.p1Seconds) + '"></div>' +
      '<div class="grow"><label class="l">Player 2 seconds</label><input data-p="fastMoney.p2Seconds" data-num="1" type="number" min="5" max="60" value="' + esc(f.p2Seconds) + '"></div>' +
      '<div class="grow"><label class="l">Points to win</label><input data-p="fastMoney.target" data-num="1" type="number" min="1" max="2000" value="' + esc(f.target) + '"></div></div>' +
    f.questions.map((x, i) => '<div class="card" style="background:var(--card2)"><label class="l">Fast Money question ' + (i + 1) + '</label>' +
      '<input data-p="fastMoney.questions.' + i + '.q" maxlength="200" value="' + esc(x.q) + '" style="margin-bottom:10px">' +
      ansRows('fastMoney.questions.' + i + '.answers', x.answers) +
      '<div class="row"><button class="small ghost" data-act="addAns" data-base="fastMoney.questions.' + i + '.answers"' + (x.answers.length >= 8 ? ' disabled' : '') + '>+ Add answer</button>' +
      '<span class="tot" data-total="fastMoney.questions.' + i + '.answers"></span><span class="grow"></span>' +
      '<button class="small bad" data-act="delFmQ" data-i="' + i + '">Delete question</button></div></div>').join('') +
    '<button class="small gold" data-act="addFmQ"' + (f.questions.length >= 7 ? ' disabled' : '') + '>+ Add question</button>';
  totals();
}
function totals() {
  document.querySelectorAll('[data-total]').forEach((el) => {
    const list = getP(D, el.dataset.total) || [];
    el.textContent = 'Total: ' + list.reduce((s, a) => s + (Number(a.pts) || 0), 0);
  });
}
function renderBasics() {
  document.querySelectorAll('[data-p="title"],[data-p="teams.0"],[data-p="teams.1"]').forEach((el) => { el.value = getP(D, el.dataset.p) || ''; });
  $('#logoWrap').innerHTML = D.logo ? '<img class="logo" src="' + D.logo + '" alt="logo">' : '';
  $('#logoDel').style.display = D.logo ? '' : 'none';
}
function renderAll() { renderBasics(); renderRounds(); renderFm(); }

/* ---------- editing ---------- */
function touch() {
  dirty = true; $('#status').textContent = 'Unsaved changes';
  try { localStorage.setItem('feud_draft', JSON.stringify(D)); } catch (e) {}
}
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-p]');
  if (!el) return;
  setP(D, el.dataset.p, el.dataset.num ? (el.value === '' ? 0 : Number(el.value)) : el.value);
  if (el.dataset.p.indexOf('answers') >= 0) totals();
  touch();
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'addRound' && D.rounds.length < 6) D.rounds.push({ title: 'Round ' + (D.rounds.length + 1), mult: Math.min(3, D.rounds.length + 1), question: '', answers: blankAns(5) });
  else if (a === 'delRound') D.rounds.splice(+b.dataset.i, 1);
  else if (a === 'addAns') { const l = getP(D, b.dataset.base); if (l.length < 8) l.push({ text: '', pts: 0 }); }
  else if (a === 'delAns') getP(D, b.dataset.base).splice(+b.dataset.j, 1);
  else if (a === 'addFmQ' && D.fastMoney.questions.length < 7) D.fastMoney.questions.push({ q: '', answers: blankAns(5) });
  else if (a === 'delFmQ') D.fastMoney.questions.splice(+b.dataset.i, 1);
  else return;
  if (a === 'addRound' || a === 'delRound') renderRounds(); else renderAll();
  touch();
});
$('#fmOn').addEventListener('change', (e) => {
  D.fastMoney.enabled = e.target.checked;
  if (e.target.checked && !D.fastMoney.questions.length) D.fastMoney.questions.push({ q: '', answers: blankAns(5) });
  renderFm(); touch();
});

/* ---------- logo ---------- */
$('#logoFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const sc = Math.min(1, 700 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL('image/png');
    if (d.length > 400000) d = c.toDataURL('image/jpeg', 0.8);
    if (d.length > 440000) { showErr('That picture is too large. Try a smaller one.'); return; }
    D.logo = d; renderBasics(); touch(); URL.revokeObjectURL(url);
  };
  img.onerror = () => showErr('Could not read that picture.');
  img.src = url; e.target.value = '';
});
$('#logoDel').onclick = () => { D.logo = ''; renderBasics(); touch(); };

/* ---------- import / export / sample ---------- */
function payload() { return JSON.stringify(D, null, 1); }
$('#exportBtn').onclick = async () => {
  $('#io').style.display = 'block'; $('#ioText').value = payload(); $('#ioText').select();
  try { await navigator.clipboard.writeText($('#ioText').value); $('#ioNote').textContent = 'Copied! Paste it into a note to keep it.'; } catch (e) { $('#ioNote').textContent = 'Select all and copy this text to keep it.'; }
};
$('#importBtn').onclick = () => { $('#io').style.display = 'block'; $('#ioText').value = ''; $('#ioNote').textContent = 'Paste a game you saved earlier, then tap Use this.'; $('#ioText').focus(); };
$('#ioClose').onclick = () => { $('#io').style.display = 'none'; };
$('#ioApply').onclick = () => {
  try {
    const d = JSON.parse($('#ioText').value);
    if (!d || !Array.isArray(d.rounds)) throw 0;
    D = toState(Object.assign({ title: '', teams: ['Team A', 'Team B'], fastMoney: { questions: [], target: 200, p1Seconds: 20, p2Seconds: 25 } }, d, { fastMoney: Object.assign({ questions: [], target: 200, p1Seconds: 20, p2Seconds: 25 }, d.fastMoney || {}) }));
    renderAll(); touch(); $('#io').style.display = 'none';
  } catch (e) { $('#ioNote').textContent = "That doesn't look like a saved game."; }
};
$('#sampleBtn').onclick = async () => {
  if (!confirm('Replace everything here with the Thanksgiving sample?')) return;
  const d = await (await fetch('/api/sample')).json(); D = toState(d); renderAll(); touch();
};

/* ---------- save ---------- */
function showErr(m) { const e = $('#err'); e.textContent = m; e.classList.toggle('on', !!m); if (m) window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('#save').onclick = async () => {
  showErr('');
  $('#save').disabled = true; $('#status').textContent = 'Saving...';
  try {
    const r = await fetch('/api/data?r=' + R + '&k=' + K, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: D }) });
    const j = await r.json();
    if (!r.ok) { showErr(j.error || 'Could not save.'); $('#save').disabled = false; $('#status').textContent = 'Not saved'; return; }
    D = toState(j.data);
    try { localStorage.setItem('feud_draft', JSON.stringify(D)); localStorage.setItem('feud_last', JSON.stringify({ code: R, key: K })); } catch (e) {}
    dirty = false;
    location.href = '/host?r=' + R + '&k=' + K;
  } catch (e) { showErr('Could not reach the server. Check your connection and try again.'); $('#save').disabled = false; $('#status').textContent = 'Not saved'; }
};
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- load ---------- */
(async () => {
  try {
    const r = await fetch('/api/data?r=' + R + '&k=' + K);
    if (r.status === 404) { document.querySelector('.wrap').innerHTML = '<h1>This game has ended</h1><p class="mut">Games are cleared after a while. Your setup is saved in this browser, so you can start a new one from the home page.</p><a class="btn gold" href="/">Go to the home page</a>'; return; }
    if (!r.ok) { location.href = '/'; return; }
    D = toState(await r.json());
    renderAll(); $('#status').textContent = 'Saved game loaded';
  } catch (e) { showErr('Could not load the game. Check your connection and reload.'); }
})();
</script>
</body>
</html>
